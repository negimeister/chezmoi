apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
spec:
  replicas: 4
  selector:
    matchLabels:
      app: memory-hog
  template:
    metadata:
      labels:
        app: memory-hog
    spec:
      containers:
      - name: memory-hog
        image: busybox
        command: ["sh", "-c", "TAIL_PID=$$; while true; do dd if=/dev/zero of=/dev/null bs=1G & sleep 10; done"]
        resources:
          requests:
            memory: "110Gi"
            cpu: "500m"
          limits:
            memory: "110Gi"
            cpu: "1000m"
